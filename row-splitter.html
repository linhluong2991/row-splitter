<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Row Splitter — Split lists into chunks</title>
  <meta name="description" content="Paste any list of rows and split them into equal-sized chunks. Free, offline, and shareable." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --surface: #141720;
      --surface2: #1c2030;
      --surface3: #242840;
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.16);
      --accent: #6c63ff;
      --accent2: #a78bfa;
      --accent-glow: rgba(108,99,255,0.3);
      --success: #34d399;
      --text: #e8eaf0;
      --text-muted: #7a7f96;
      --text-dim: #4a4f66;
      --radius: 14px;
      --radius-sm: 8px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: -40%;
      left: -20%;
      width: 80%;
      height: 80%;
      background: radial-gradient(ellipse at center, rgba(108,99,255,0.12) 0%, transparent 70%);
      pointer-events: none;
      animation: drift 12s ease-in-out infinite alternate;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -30%;
      right: -10%;
      width: 60%;
      height: 60%;
      background: radial-gradient(ellipse at center, rgba(167,139,250,0.08) 0%, transparent 70%);
      pointer-events: none;
      animation: drift 16s ease-in-out infinite alternate-reverse;
    }
    @keyframes drift {
      from { transform: translate(0, 0); }
      to   { transform: translate(40px, 30px); }
    }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 56px 24px 32px;
      position: relative;
      z-index: 1;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(108,99,255,0.2), rgba(167,139,250,0.1));
      border: 1px solid rgba(108,99,255,0.35);
      border-radius: 100px;
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent2);
      margin-bottom: 20px;
    }
    .logo-badge svg { width: 14px; height: 14px; }
    h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700;
      background: linear-gradient(135deg, #fff 30%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    .subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── Main layout ── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px 80px;
      position: relative;
      z-index: 1;
    }

    /* ── Control panel ── */
    .control-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 24px;
      backdrop-filter: blur(20px);
    }

    .panel-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 16px;
    }

    textarea#input-text {
      width: 100%;
      height: 200px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.7;
      padding: 14px 16px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    textarea#input-text::placeholder { color: var(--text-dim); }
    textarea#input-text:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .controls-row {
      display: flex;
      align-items: flex-end;
      gap: 16px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-group label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }
    .input-group input[type="number"] {
      width: 120px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 500;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-group input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* hide number arrows */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

    .btn-split {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      padding: 10px 28px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      box-shadow: 0 4px 20px rgba(108,99,255,0.4);
    }
    .btn-split:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(108,99,255,0.5); }
    .btn-split:active { transform: translateY(0); }
    .btn-split svg { width: 16px; height: 16px; }

    .btn-clear {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      padding: 10px 20px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-clear:hover { border-color: var(--border-hover); color: var(--text); }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .stat {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .stat-value {
      font-weight: 700;
      color: var(--accent2);
      font-size: 15px;
    }

    /* ── Global actions ── */
    .global-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .results-heading {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }
    .results-heading span {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 14px;
      margin-left: 8px;
    }
    .actions-right { display: flex; gap: 10px; }

    .btn-sm {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 7px 14px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .btn-sm:hover { background: var(--surface2); border-color: var(--border-hover); color: var(--text); }
    .btn-sm svg { width: 14px; height: 14px; }

    /* ── Results grid ── */
    #results-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }

    .chunk-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
      animation: fadeUp 0.3s ease both;
    }
    .chunk-box:hover {
      border-color: rgba(108,99,255,0.4);
      box-shadow: 0 4px 24px rgba(108,99,255,0.12);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .chunk-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }
    .chunk-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chunk-number {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .chunk-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .chunk-range {
      font-size: 11px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
    }
    .chunk-row-count {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface3);
      border-radius: 100px;
      padding: 2px 10px;
    }

    .chunk-body {
      padding: 12px 0;
      max-height: 300px;
      overflow-y: auto;
    }
    /* custom scrollbar */
    .chunk-body::-webkit-scrollbar { width: 4px; }
    .chunk-body::-webkit-scrollbar-track { background: transparent; }
    .chunk-body::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

    .chunk-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 3px 16px;
      font-size: 12.5px;
      line-height: 1.55;
      transition: background 0.1s;
    }
    .chunk-row:hover { background: var(--surface2); }
    .chunk-row-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      min-width: 28px;
      text-align: right;
      flex-shrink: 0;
      user-select: none;
    }
    .chunk-row-text {
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      word-break: break-word;
    }

    .chunk-footer {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      background: var(--surface2);
    }
    .btn-copy {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--surface3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 7px 12px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .btn-copy:hover { background: rgba(108,99,255,0.15); border-color: rgba(108,99,255,0.4); color: var(--accent2); }
    .btn-copy.copied { color: var(--success); border-color: rgba(52,211,153,0.4); background: rgba(52,211,153,0.1); }
    .btn-copy svg { width: 13px; height: 13px; }

    /* ── Empty state ── */
    #empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-dim);
    }
    #empty-state svg { width: 56px; height: 56px; opacity: 0.3; margin-bottom: 16px; }
    #empty-state p { font-size: 15px; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface3);
      border: 1px solid rgba(52,211,153,0.3);
      border-radius: 100px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 500;
      color: var(--success);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 100;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      header { padding: 36px 20px 24px; }
      .control-panel { padding: 20px; }
      #results-container { grid-template-columns: 1fr; }
      .controls-row { flex-direction: column; align-items: stretch; }
      .btn-split { justify-content: center; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/>
      </svg>
      Row Splitter
    </div>
    <h1>Split rows into chunks</h1>
    <p class="subtitle">Paste your list, set the chunk size, and instantly get neatly grouped boxes.</p>
  </header>

  <main>
    <!-- Control Panel -->
    <div class="control-panel">
      <div class="panel-label">📋 Input</div>
      <textarea id="input-text" placeholder="Paste your rows here — one item per line&#10;&#10;Row 1&#10;Row 2&#10;Row 3&#10;..."></textarea>

      <div class="controls-row">
        <div class="input-group">
          <label for="chunk-size">Rows per chunk</label>
          <input type="number" id="chunk-size" value="100" min="1" max="100000" />
        </div>

        <div class="input-group">
          <label for="skip-empty">Skip empty lines</label>
          <div style="display:flex;align-items:center;gap:8px;height:40px;">
            <label class="toggle" style="position:relative;display:inline-block;width:44px;height:24px;">
              <input type="checkbox" id="skip-empty" checked style="opacity:0;width:0;height:0;position:absolute;" />
              <span class="toggle-slider" style="
                position:absolute;top:0;left:0;right:0;bottom:0;
                background:var(--surface3);border-radius:24px;cursor:pointer;
                transition:background 0.2s;
              "></span>
            </label>
          </div>
        </div>

        <button class="btn-split" id="btn-split" onclick="splitRows()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/>
          </svg>
          Split
        </button>
        <button class="btn-clear" onclick="clearAll()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
          </svg>
          Clear
        </button>
      </div>

      <div class="stats-bar" id="stats-bar" style="display:none;">
        <div class="stat">Total rows <span class="stat-value" id="stat-total">0</span></div>
        <div class="stat">Chunk size <span class="stat-value" id="stat-size">0</span></div>
        <div class="stat">Chunks created <span class="stat-value" id="stat-chunks">0</span></div>
        <div class="stat">Last chunk <span class="stat-value" id="stat-last">0</span> rows</div>
      </div>
    </div>

    <!-- Results -->
    <div id="results-section" style="display:none;">
      <div class="global-actions">
        <div class="results-heading" id="results-heading">Results <span></span></div>
        <div class="actions-right">
          <button class="btn-sm" onclick="copyAll()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
            </svg>
            Copy all chunks
          </button>
          <button class="btn-sm" onclick="downloadTxt()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Download .txt
          </button>
        </div>
      </div>
      <div id="results-container"></div>
    </div>

    <!-- Empty state (before first split) -->
    <div id="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="9" x2="9" y2="21"/>
      </svg>
      <p>Paste your rows above and click <strong style="color:var(--text-muted)">Split</strong></p>
    </div>
  </main>

  <div id="toast"></div>

  <script>
    // ── Toggle switch styling ──────────────────────────────
    const toggleInput = document.getElementById('skip-empty');
    const toggleSlider = document.querySelector('.toggle-slider');
    function updateToggle() {
      toggleSlider.style.background = toggleInput.checked
        ? 'linear-gradient(135deg, #6c63ff, #8b5cf6)'
        : 'var(--surface3)';
      toggleSlider.style.boxShadow = toggleInput.checked
        ? '0 0 0 1px rgba(108,99,255,0.5)' : 'none';
    }
    toggleInput.addEventListener('change', updateToggle);
    updateToggle();

    // Fake knob on toggle
    toggleSlider.insertAdjacentHTML('beforeend', `<span id="toggle-knob" style="
      position:absolute;height:18px;width:18px;left:3px;bottom:3px;
      background:white;border-radius:50%;
      transition:transform 0.2s;
    "></span>`);
    const knob = document.getElementById('toggle-knob');
    toggleInput.addEventListener('change', () => {
      knob.style.transform = toggleInput.checked ? 'translateX(20px)' : 'translateX(0)';
      updateToggle();
    });
    if (toggleInput.checked) knob.style.transform = 'translateX(20px)';

    // ── Core logic ────────────────────────────────────────
    let chunks = [];

    function splitRows() {
      const raw = document.getElementById('input-text').value;
      const chunkSize = parseInt(document.getElementById('chunk-size').value, 10);
      const skipEmpty = document.getElementById('skip-empty').checked;

      if (!raw.trim()) { showToast('⚠️ Please paste some rows first'); return; }
      if (!chunkSize || chunkSize < 1) { showToast('⚠️ Chunk size must be ≥ 1'); return; }

      let rows = raw.split('\n');
      if (skipEmpty) rows = rows.filter(r => r.trim() !== '');

      chunks = [];
      for (let i = 0; i < rows.length; i += chunkSize) {
        chunks.push(rows.slice(i, i + chunkSize));
      }

      renderResults(rows.length, chunkSize);
    }

    function renderResults(totalRows, chunkSize) {
      const container = document.getElementById('results-container');
      container.innerHTML = '';

      // Stats
      document.getElementById('stat-total').textContent = totalRows.toLocaleString();
      document.getElementById('stat-size').textContent = chunkSize.toLocaleString();
      document.getElementById('stat-chunks').textContent = chunks.length.toLocaleString();
      document.getElementById('stat-last').textContent = chunks.length ? chunks[chunks.length - 1].length.toLocaleString() : 0;
      document.getElementById('stats-bar').style.display = 'flex';

      // Results heading
      document.getElementById('results-heading').innerHTML =
        `Results <span>${chunks.length} chunk${chunks.length !== 1 ? 's' : ''}</span>`;

      document.getElementById('empty-state').style.display = 'none';
      document.getElementById('results-section').style.display = 'block';

      chunks.forEach((chunk, idx) => {
        const startRow = (idx * chunkSize) + 1;
        const endRow   = startRow + chunk.length - 1;

        const box = document.createElement('div');
        box.className = 'chunk-box';
        box.style.animationDelay = `${idx * 30}ms`;

        box.innerHTML = `
          <div class="chunk-header">
            <div class="chunk-title">
              <div class="chunk-number">${idx + 1}</div>
              <div>
                <div class="chunk-label">Chunk ${idx + 1}</div>
                <div class="chunk-range">rows ${startRow.toLocaleString()} – ${endRow.toLocaleString()}</div>
              </div>
            </div>
            <div class="chunk-row-count">${chunk.length} rows</div>
          </div>
          <div class="chunk-body">
            ${chunk.map((row, ri) => `
              <div class="chunk-row">
                <span class="chunk-row-num">${(startRow + ri)}</span>
                <span class="chunk-row-text">${escapeHtml(row)}</span>
              </div>`).join('')}
          </div>
          <div class="chunk-footer">
            <button class="btn-copy" id="copy-btn-${idx}" onclick="copyChunk(${idx})">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
              </svg>
              Copy chunk
            </button>
            <button class="btn-copy" onclick="downloadChunk(${idx})">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              Download
            </button>
          </div>`;

        container.appendChild(box);
      });

      // Scroll to results
      document.getElementById('results-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ── Actions ───────────────────────────────────────────
    function copyChunk(idx) {
      const text = chunks[idx].join('\n');
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById(`copy-btn-${idx}`);
        btn.classList.add('copied');
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Copied!`;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy chunk`;
        }, 2000);
        showToast(`✅ Chunk ${idx + 1} copied to clipboard`);
      });
    }

    function copyAll() {
      const text = chunks.map((chunk, i) =>
        `=== Chunk ${i + 1} (${chunk.length} rows) ===\n${chunk.join('\n')}`
      ).join('\n\n');
      navigator.clipboard.writeText(text).then(() => showToast('✅ All chunks copied!'));
    }

    function downloadChunk(idx) {
      const text = chunks[idx].join('\n');
      download(`chunk-${idx + 1}.txt`, text);
    }

    function downloadTxt() {
      const text = chunks.map((chunk, i) =>
        `=== Chunk ${i + 1} (${chunk.length} rows) ===\n${chunk.join('\n')}`
      ).join('\n\n');
      download('all-chunks.txt', text);
    }

    function download(filename, text) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
      showToast(`⬇️ ${filename} downloaded`);
    }

    function clearAll() {
      document.getElementById('input-text').value = '';
      document.getElementById('results-container').innerHTML = '';
      document.getElementById('results-section').style.display = 'none';
      document.getElementById('stats-bar').style.display = 'none';
      document.getElementById('empty-state').style.display = 'block';
      chunks = [];
    }

    // ── Toast ─────────────────────────────────────────────
    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
    }

    // ── Utils ─────────────────────────────────────────────
    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ── Keyboard shortcut ─────────────────────────────────
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') splitRows();
    });
  </script>
</body>
</html>
